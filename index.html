<script>


/******************************************************
 * CONFIG
 ******************************************************/

/*
 * สำคัญมาก
 *
 * ใส่ Web App URL ของ Google Apps Script
 * ที่นี่
 *
 * ตัวอย่าง:
 *
 * https://script.google.com/macros/s/XXXXXXXX/exec
 */

const API_URL =
  'https://script.google.com/macros/s/AKfycbynQ-Hm35v9GeL97kVtps994XtLb_o0j-y74YZVe-cnPnB5iH2Sx08Ipa4k4bL_H4q8cw/exec';


/******************************************************
 * VARIABLES
 ******************************************************/

let scanner = null;

let running = false;

let lastCode = '';

let lastTime = 0;

let count = 0;


/******************************************************
 * START SCANNER
 ******************************************************/

async function startScanner() {

  hideError();


  const startBtn =
    document.getElementById(
      'startBtn'
    );


  startBtn.disabled = true;


  /*
   * ตรวจสอบ Camera API
   */

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      'Browser นี้ไม่รองรับการเปิดกล้อง'
    );

    startBtn.disabled = false;

    return;

  }


  /*
   * ตรวจสอบ API URL
   */

  if (
    !API_URL ||
    API_URL.indexOf(
      'script.google.com'
    ) === -1
  ) {

    showError(
      '<b>ยังไม่ได้ตั้งค่า API_URL</b><br><br>' +
      'กรุณาใส่ Web App URL ของ Google Apps Script'
    );

    startBtn.disabled = false;

    return;

  }


  try {

    setStatus(
      'กำลังขอสิทธิ์ใช้กล้อง...'
    );


    /*
     * ขอ Permission กล้อง
     */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {
            facingMode: {
              ideal: 'environment'
            }
          },

          audio: false

        });


    /*
     * ได้ Permission แล้ว
     * ปิด stream ชั่วคราว
     */

    stream
      .getTracks()
      .forEach(
        function(track) {
          track.stop();
        }
      );


    setStatus(
      'กำลังเปิดกล้อง...'
    );


    /*
     * สร้าง Barcode Scanner
     */

    if (!scanner) {

      scanner =
        new Html5Qrcode(
          'reader'
        );

    }


    /*
     * เปิดกล้องหลัง
     */

    await scanner.start(

      {
        facingMode:
          'environment'
      },

      {

        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const min =
            Math.min(
              width,
              height
            );


          return {

            width:
              Math.floor(
                min * 0.80
              ),

            height:
              Math.floor(
                min * 0.35
              )

          };

        },

        aspectRatio:
          1.7777778,

        disableFlip: false

      },

      onScanSuccess,

      onScanFailure

    );


    running = true;


    document
      .getElementById(
        'startBtn'
      )
      .style.display =
      'none';


    document
      .getElementById(
        'stopBtn'
      )
      .style.display =
      'block';


    setStatus(
      '🟢 กล้องพร้อม — สแกน Barcode ได้เลย'
    );


  }

  catch (error) {

    console.error(
      'Camera Error:',
      error
    );


    startBtn.disabled = false;


    showError(

      '<b>ไม่สามารถเปิดกล้องได้</b><br><br>' +

      '<b>Error:</b> ' +

      escapeHtml(
        error.name || ''
      ) +

      '<br>' +

      escapeHtml(
        error.message || String(error)
      )

    );


    setStatus(
      '❌ เปิดกล้องไม่สำเร็จ'
    );

  }

}


/******************************************************
 * SCAN SUCCESS
 ******************************************************/

function onScanSuccess(
  decodedText,
  decodedResult
) {

  const code =
    String(
      decodedText || ''
    ).trim();


  if (!code) {
    return;
  }


  const now =
    Date.now();


  /*
   * ป้องกัน Barcode เดิม
   * ถูกอ่านซ้ำภายใน 2 วินาที
   */

  if (
    code === lastCode &&
    now - lastTime < 2000
  ) {

    return;

  }


  lastCode = code;

  lastTime = now;


  /*
   * แสดง Barcode ล่าสุด
   */

  document
    .getElementById(
      'last'
    )
    .textContent =
    code;


  setStatus(
    '⏳ กำลังบันทึก ' +
    code
  );


  /*
   * บันทึก
   */

  saveBarcode(code);

}


/******************************************************
 * SAVE BARCODE
 ******************************************************/

async function saveBarcode(
  barcode
) {

  try {

    const response =
      await fetch(

        API_URL,

        {

          method: 'POST',

          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },

          body:
            JSON.stringify({

              barcode:
                barcode

            })

        }

      );


    const result =
      await response.json();


    if (
      result &&
      result.success
    ) {


      /*
       * เพิ่มจำนวน
       */

      count++;


      document
        .getElementById(
          'count'
        )
        .textContent =
        count;


      /*
       * เพิ่มรายการล่าสุด
       */

      addRecent(
        result
      );


      /*
       * เสียง
       */

      playBeep();


      /*
       * แสดงสถานะ
       */

      setStatus(
        '✅ บันทึกแล้ว — พร้อมสแกนรายการถัดไป'
      );


    }

    else {

      setStatus(
        '❌ บันทึกไม่สำเร็จ'
      );


      showError(
        result &&
        result.message
          ? result.message
          : 'ไม่สามารถบันทึกข้อมูลได้'
      );

    }

  }

  catch (error) {

    console.error(
      'Save Error:',
      error
    );


    showError(

      '<b>ส่งข้อมูลไป Google Sheet ไม่สำเร็จ</b><br><br>' +

      escapeHtml(
        error.message ||
        String(error)
      )

    );


    setStatus(
      '❌ เชื่อมต่อ Google Sheet ไม่สำเร็จ'
    );

  }

}


/******************************************************
 * STOP SCANNER
 ******************************************************/

async function stopScanner() {

  try {

    if (
      scanner &&
      running
    ) {

      await scanner.stop();

    }

  }

  catch (error) {

    console.error(
      error
    );

  }


  running = false;


  document
    .getElementById(
      'startBtn'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'startBtn'
    )
    .disabled =
    false;


  document
    .getElementById(
      'stopBtn'
    )
    .style.display =
    'none';


  setStatus(
    'กล้องปิดแล้ว'
  );

}


/******************************************************
 * ADD RECENT
 ******************************************************/

function addRecent(
  result
) {

  const recent =
    document
      .getElementById(
        'recent'
      );


  /*
   * ลบข้อความ
   * "ยังไม่มีรายการ"
   */

  if (
    recent.textContent.trim() ===
    'ยังไม่มีรายการ'
  ) {

    recent.innerHTML =
      '';

  }


  const row =
    document.createElement(
      'div'
    );


  row.className =
    'recent-row';


  row.innerHTML =

    '<div class="recent-code">' +

      escapeHtml(
        result.barcode
      ) +

    '</div>' +

    '<div class="recent-time">' +

      escapeHtml(
        result.date || ''
      ) +

      ' ' +

      escapeHtml(
        result.time || ''
      ) +

    '</div>';


  recent.prepend(
    row
  );

}


/******************************************************
 * BEEP
 ******************************************************/

function playBeep() {

  try {

    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {
      return;
    }


    const context =
      new AudioContext();


    const oscillator =
      context.createOscillator();


    const gain =
      context.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      1000;


    gain.gain.value =
      0.15;


    oscillator.connect(
      gain
    );


    gain.connect(
      context.destination
    );


    oscillator.start();


    setTimeout(
      function() {

        oscillator.stop();

        context.close();

      },
      120
    );

  }

  catch (error) {

    console.log(
      'Beep Error:',
      error
    );

  }

}


/******************************************************
 * STATUS
 ******************************************************/

function setStatus(
  message
) {

  document
    .getElementById(
      'status'
    )
    .innerHTML =
    message;

}


/******************************************************
 * ERROR
 ******************************************************/

function showError(
  message
) {

  const box =
    document
      .getElementById(
        'error'
      );


  box.innerHTML =
    message;


  box.style.display =
    'block';

}


function hideError() {

  const box =
    document
      .getElementById(
        'error'
      );


  box.innerHTML =
    '';


  box.style.display =
    'none';

}


/******************************************************
 * ESCAPE HTML
 ******************************************************/

function escapeHtml(
  value
) {

  return String(
    value || ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}

</script>

</body>

</html>
