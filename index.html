<body>


<!-- ===================================================

<div class="header">

<div class="container">

  <div class="card">


    <div id="reader"></div>

    <button

      style="display:none">

      <br><br>

      สามารถสแกน Barcode ต่อเนื่องได้เลย

  <!-- =================================================

  ================================================== -->

      Barcode ล่าสุด

    </div>

      -

    </div>

  </div>



  <!-- =================================================
       RECENT LIST
  ================================================== -->

    <div class="recent-title">

      📋 รายการล่าสุด

    </div>

      ยังไม่มีรายการ

    </div>

  </div>


</div>



<script>


/******************************************************
 * CONFIG
 ******************************************************/

/*
 * =====================================================
 * สำคัญมาก
 * =====================================================
 *
 * ใส่ URL ของ Google Apps Script Web App ตรงนี้
 *
 * ตัวอย่าง:
 *
 * https://script.google.com/macros/s/XXXXXXXXXXXX/exec
 *
 */

const API_URL =
  'https://script.google.com/macros/s/AKfycbynQ-Hm35v9GeL97kVtps994XtLb_o0j-y74YZVe-cnPnB5iH2Sx08Ipa4k4bL_H4q8cw/exec';



/******************************************************
 * VARIABLES
 ******************************************************/

let scanner = null;

let running = false;

let lastCode = '';

let lastTime = 0;

let count = 0;

let saving = false;



/******************************************************
 * START SCANNER
 ******************************************************/

async function startScanner() {


  hideError();


  const startBtn =
    document.getElementById(
      'startBtn'
    );


  startBtn.disabled = true;


  /*
   * ตรวจสอบ Camera API
   */

  if (
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ) {

    showError(
      'Browser นี้ไม่รองรับการเปิดกล้อง'
    );

    startBtn.disabled = false;

    return;

  }


  /*
   * ตรวจสอบ HTTPS
   */

  if (
    location.protocol !== 'https:' &&
    location.hostname !== 'localhost'
  ) {

    showError(
      '<b>ต้องเปิดเว็บผ่าน HTTPS</b><br><br>' +
      'GitHub Pages ต้องเปิดผ่าน https://'
    );

    startBtn.disabled = false;

    return;

  }


  /*
   * ตรวจสอบ API URL
   */

  if (
    !API_URL ||
    API_URL.indexOf(
      'script.google.com'
    ) === -1
  ) {

    showError(

      '<b>ยังไม่ได้ตั้งค่า API_URL</b><br><br>' +

      'กรุณาแก้ไขบรรทัดนี้ใน Index.html:<br><br>' +

      '<code>const API_URL = ...</code>'

    );


    startBtn.disabled = false;

    return;

  }



  try {


    setStatus(
      'กำลังขอสิทธิ์ใช้กล้อง...'
    );


    /*
     * =================================================
     * ขอสิทธิ์กล้องโดยตรง
     * =================================================
     *
     * ใช้กล้องหลังเป็นหลัก
     */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: 'environment'
            }

          },

          audio: false

        });


    /*
     * Permission ผ่านแล้ว
     *
     * ปิด stream ตัวทดสอบ
     */

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    setStatus(
      'กำลังเปิดกล้อง...'
    );


    /*
     * สร้าง Scanner
     */

    if (!scanner) {

      scanner =
        new Html5Qrcode(
          'reader'
        );

    }


    /*
     * =================================================
     * เปิดกล้อง
     * =================================================
     */

    await scanner.start(

      {
        facingMode:
          'environment'
      },


      {

        fps: 10,


        qrbox:
          function(width, height) {


            const min =
              Math.min(
                width,
                height
              );


            return {

              width:
                Math.floor(
                  min * 0.85
                ),

              height:
                Math.floor(
                  min * 0.35
                )

            };

          },


        aspectRatio:
          1.7777778,


        disableFlip:
          false

      },


      /*
       * Scan Success
       */

      onScanSuccess,


      /*
       * Scan Failure
       *
       * สำคัญ:
       * ต้องมีฟังก์ชันนี้
       */

      onScanFailure

    );


    /*
     * Scanner ทำงานแล้ว
     */

    running = true;


    startBtn.style.display =
      'none';


    document
      .getElementById(
        'stopBtn'
      )
      .style.display =
      'block';


    setStatus(
      '🟢 กล้องพร้อม — สแกน Barcode ได้เลย'
    );


  }


  catch (error) {


    console.error(
      'Camera Error:',
      error
    );


    startBtn.disabled = false;


    let message =
      '<b>ไม่สามารถเปิดกล้องได้</b><br><br>';


    if (
      error &&
      error.name
    ) {

      message +=
        '<b>Error:</b> ' +
        escapeHtml(
          error.name
        ) +
        '<br>';

    }


    if (
      error &&
      error.message
    ) {

      message +=
        escapeHtml(
          error.message
        );

    }


    message +=
      '<br><br>' +
      'กรุณาตรวจสอบว่า Browser อนุญาตให้ใช้กล้องแล้ว';


    showError(
      message
    );


    setStatus(
      '❌ เปิดกล้องไม่สำเร็จ'
    );

  }

}



/******************************************************
 * SCAN SUCCESS
 ******************************************************/

function onScanSuccess(
  decodedText,
  decodedResult
) {


  const code =
    String(
      decodedText || ''
    ).trim();


  /*
   * ไม่มี Barcode
   */

  if (!code) {

    return;

  }


  const now =
    Date.now();


  /*
   * =================================================
   * ป้องกันการอ่าน Barcode เดิมซ้ำ
   * ภายใน 2 วินาที
   * =================================================
   */

  if (
    code === lastCode &&
    now - lastTime < 2000
  ) {

    return;

  }


  /*
   * จำ Barcode ล่าสุด
   */

  lastCode =
    code;

  lastTime =
    now;


  /*
   * แสดง Barcode
   */

  document
    .getElementById(
      'last'
    )
    .textContent =
    code;


  /*
   * ถ้ากำลังบันทึกอยู่
   * ไม่ส่งซ้ำ
   */

  if (saving) {

    return;

  }


  /*
   * เริ่มบันทึก
   */

  saveBarcode(
    code
  );

}



/******************************************************
 * SCAN FAILURE
 ******************************************************/

/*
 * สำคัญมาก
 *
 * ฟังก์ชันนี้ต้องมี
 *
 * html5-qrcode จะเรียกฟังก์ชันนี้
 * ทุกครั้งที่กล้องยังอ่าน Barcode ไม่ได้
 *
 * ไม่ต้องแสดง Error เพราะการอ่านไม่เจอ
 * ในแต่ละ frame เป็นเรื่องปกติ
 */

function onScanFailure(
  error
) {

  // ไม่ต้องทำอะไร

}



/******************************************************
 * SAVE BARCODE
 ******************************************************/

async function saveBarcode(
  barcode
) {


  saving = true;


  hideError();


  setStatus(

    '⏳ กำลังบันทึก ' +
    escapeHtml(
      barcode
    )

  );


  try {


    /*
     * =================================================
     * ส่งข้อมูลไป Google Apps Script
     * =================================================
     */

    const response =
      await fetch(

        API_URL,

        {

          method:
            'POST',


          headers: {

            'Content-Type':
              'text/plain;charset=utf-8'

          },


          body:
            JSON.stringify({

              barcode:
                barcode

            })

        }

      );


    /*
     * อ่าน Response
     */

    const result =
      await response.json();


    /*
     * =================================================
     * บันทึกสำเร็จ
     * =================================================
     */

    if (
      result &&
      result.success
    ) {


      /*
       * เพิ่มจำนวน
       */

      count++;


      document
        .getElementById(
          'count'
        )
        .textContent =
        count;


      /*
       * เพิ่มรายการล่าสุด
       */

      addRecent(
        result
      );


      /*
       * เสียง
       */

      playBeep();


      /*
       * สถานะ
       */

      setStatus(

        '✅ บันทึกแล้ว — พร้อมสแกนรายการถัดไป'

      );


    }


    else {


      setStatus(
        '❌ บันทึกไม่สำเร็จ'
      );


      showError(

        result &&
        result.message

          ? result.message

          : 'ไม่สามารถบันทึกข้อมูลได้'

      );

    }


  }


  catch (error) {


    console.error(
      'Save Error:',
      error
    );


    showError(

      '<b>ส่งข้อมูลไป Google Sheet ไม่สำเร็จ</b><br><br>' +

      escapeHtml(

        error.message ||
        String(error)

      )

    );


    setStatus(
      '❌ เชื่อมต่อ Google Sheet ไม่สำเร็จ'
    );

  }


  finally {


    /*
     * พร้อมรับ Barcode ถัดไป
     */

    saving = false;


  }

}



/******************************************************
 * STOP SCANNER
 ******************************************************/

async function stopScanner() {


  try {


    if (
      scanner &&
      running
    ) {


      await scanner.stop();


    }


  }


  catch (error) {


    console.error(
      'Stop Error:',
      error
    );


  }


  running = false;


  /*
   * แสดงปุ่มเปิดกล้อง
   */

  document
    .getElementById(
      'startBtn'
    )
    .style.display =
    'block';


  document
    .getElementById(
      'startBtn'
    )
    .disabled =
    false;


  /*
   * ซ่อนปุ่มปิด
   */

  document
    .getElementById(
      'stopBtn'
    )
    .style.display =
    'none';


  setStatus(
    'กล้องปิดแล้ว'
  );

}



/******************************************************
 * ADD RECENT
 ******************************************************/

function addRecent(
  result
) {


  const recent =
    document
      .getElementById(
        'recent'
      );


  /*
   * ลบข้อความเริ่มต้น
   */

  if (
    recent.textContent.trim() ===
    'ยังไม่มีรายการ'
  ) {

    recent.innerHTML =
      '';

  }


  /*
   * สร้างแถวใหม่
   */

  const row =
    document.createElement(
      'div'
    );


  row.className =
    'recent-row';


  row.innerHTML =

    '<div class="recent-code">' +

      escapeHtml(
        result.barcode
      ) +

    '</div>' +

    '<div class="recent-time">' +

      escapeHtml(
        result.date || ''
      ) +

      ' ' +

      escapeHtml(
        result.time || ''
      ) +

    '</div>';


  /*
   * เอารายการใหม่ไว้ด้านบน
   */

  recent.prepend(
    row
  );



  /*
   * จำกัดรายการบนหน้าจอ
   * เหลือ 10 รายการ
   */

  while (
    recent.children.length > 10
  ) {

    recent.removeChild(
      recent.lastChild
    );

  }

}



/******************************************************
 * BEEP
 ******************************************************/

function playBeep() {


  try {


    const AudioContext =
      window.AudioContext ||
      window.webkitAudioContext;


    if (!AudioContext) {

      return;

    }


    const context =
      new AudioContext();


    const oscillator =
      context.createOscillator();


    const gain =
      context.createGain();


    oscillator.type =
      'sine';


    oscillator.frequency.value =
      1000;


    gain.gain.value =
      0.15;


    oscillator.connect(
      gain
    );


    gain.connect(
      context.destination
    );


    oscillator.start();


    setTimeout(

      function() {


        oscillator.stop();


        context.close();


      },

      120

    );


  }


  catch (error) {


    console.log(
      'Beep Error:',
      error
    );


  }

}



/******************************************************
 * STATUS
 ******************************************************/

function setStatus(
  message
) {


  document
    .getElementById(
      'status'
    )
    .innerHTML =
    message;

}



/******************************************************
 * SHOW ERROR
 ******************************************************/

function showError(
  message
) {


  const box =
    document
      .getElementById(
        'error'
      );


  box.innerHTML =
    message;


  box.style.display =
    'block';

}



/******************************************************
 * HIDE ERROR
 ******************************************************/

function hideError() {


  const box =
    document
      .getElementById(
        'error'
      );


  box.innerHTML =
    '';


  box.style.display =
    'none';

}



/******************************************************
 * ESCAPE HTML
 ******************************************************/

function escapeHtml(
  value
) {


  return String(
    value || ''
  )


  .replace(
    /&/g,
    '&amp;'
  )


  .replace(
    /</g,
    '&lt;'
  )


  .replace(
    />/g,
    '&gt;'
  )


  .replace(
    /"/g,
    '&quot;'
  )


  .replace(
    /'/g,
    '&#039;'
  );

}



/******************************************************
 * PAGE LOAD
 ******************************************************/

window.addEventListener(

  'load',

  function() {

    console.log(
      'Barcode Scanner Ready'
    );

  }

);

</script>
